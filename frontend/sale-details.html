
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sale Details | SmartBiz Rwanda</title>

    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/sales.css">
</head>
<body>

    <div class="app-layout">

        <div class="sidebar-overlay" id="sidebarOverlay"></div>
        <div id="sidebarMount"></div>

        <main class="app-main main-content sales-main">

            <header class="sales-header details-header">

                <div class="details-heading">
                    <button
                        type="button"
                        class="menu-toggle"
                        id="menuToggle"
                        aria-label="Open navigation menu"
                        aria-expanded="false"
                    >
                        &#9776;
                    </button>

                    <div>
                        <p class="sales-eyebrow">SALES MANAGEMENT</p>
                        <h1>Sale Details</h1>
                        <p class="sales-subtitle">
                            Review the invoice, items and payment records.
                        </p>
                    </div>
                </div>

                <div class="details-actions">
                    <a href="sales.html" class="sales-secondary-link">
                        Back to sales
                    </a>

                    <button
                        type="button"
                        id="printSaleBtn"
                        class="sales-primary-link"
                        disabled
                    >
                        Print invoice
                    </button>
                </div>

            </header>

            <div
                id="saleDetailsMessage"
                class="sales-message"
                role="alert"
                aria-live="polite"
                hidden
            ></div>

            <div id="saleDetailsContent">
                <div class="sales-panel sales-loading">
                    Loading sale details...
                </div>
            </div>

        </main>
    </div>

    <script src="js/config/api.js"></script>
    <script src="js/services/auth.service.js"></script>
    <script src="js/services/sales.service.js"></script>
    <script src="js/components/sidebar.js"></script>
    <script src="js/pages/sale-details.js"></script>

</body>
</html>
